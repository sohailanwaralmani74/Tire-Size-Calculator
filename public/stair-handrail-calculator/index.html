        <h2 style="font-size: 1.25rem; font-weight: bold; margin-top: 1.5rem;">Frequently Asked Questions</h2>
        
          <div style="margin-top: 1rem;">
            <h3 style="font-size: 1rem; font-weight: 600;">What is the maximum riser height and minimum tread run for residential stairs?</h3>
            <p style="color: #334155; margin-top: 0.25rem;">According to the International Residential Code (IRC 2024 Section R311.7.5), the maximum riser height is 7-3/4 inches (7.75″) and the minimum tread depth/run is 10 inches (10.0″) with a 3/4″ to 1-1/4″ nosing projection. The greatest riser height within any flight cannot exceed the smallest by more than 3/8 inch.</p>
          </div>
        
          <div style="margin-top: 1rem;">
            <h3 style="font-size: 1rem; font-weight: 600;">What is the required handrail height according to building code?</h3>
            <p style="color: #334155; margin-top: 0.25rem;">Both residential (IRC R311.7.8.1) and commercial (IBC 1014.2 / ADA 505.4) codes mandate handrail height between 34 inches and 38 inches measured vertically from the sloped plane of the tread nosings to the top of the handrail gripping surface.</p>
          </div>
        
          <div style="margin-top: 1rem;">
            <h3 style="font-size: 1rem; font-weight: 600;">What are the ADA requirements for handrail extensions?</h3>
            <p style="color: #334155; margin-top: 0.25rem;">Under ADA Standards for Accessible Design Section 505.10, handrails on commercial and public stairs must extend horizontally at least 12 inches beyond the top riser, and must continue to slope for the depth of one tread plus extend 12 inches horizontally beyond the bottom riser.</p>
          </div>
        
          <div style="margin-top: 1rem;">
